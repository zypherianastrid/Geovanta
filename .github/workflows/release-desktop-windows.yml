name: Release Desktop Windows & Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach Windows installers and Android APK to (e.g. v1.3.2)'
        required: true
        default: 'v1.3.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Rust stable (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build offline bundle and Windows 64-bit Tauri installers
        shell: pwsh
        run: |
          node scripts/build-offline-bundle.js
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Build Android APK
        shell: pwsh
        run: |
          npx cap sync android
          Push-Location android
          try {
            .\gradlew.bat assembleDebug --no-daemon
          } finally {
            Pop-Location
          }

      - name: Upload Windows installers and Android APK to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          $nsisSrc = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe" | Select-Object -First 1
          $msiSrc = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi" | Select-Object -First 1
          $apkSrc = "android\app\build\outputs\apk\debug\app-debug.apk"
          $outDir = "dist\release-assets"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $assets = @()
          if ($nsisSrc) {
            $nsisDst = Join-Path $outDir "Geovanta-Vector-Editor_${ver}_x64-setup.exe"
            Copy-Item $nsisSrc.FullName $nsisDst -Force
            $assets += $nsisDst
          }
          if ($msiSrc) {
            $msiDst = Join-Path $outDir "Geovanta-Vector-Editor_${ver}_x64_en-US.msi"
            Copy-Item $msiSrc.FullName $msiDst -Force
            $assets += $msiDst
          }
          if (Test-Path $apkSrc) {
            $apkDst = Join-Path $outDir "Geovanta-v${ver}-android.apk"
            Copy-Item $apkSrc $apkDst -Force
            $assets += $apkDst
          }
          if ($assets.Count -eq 0) {
            throw "No release artifacts found."
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Geovanta Vector Editor $tag" --notes "Official Windows 64-bit installers (.exe, .msi) and Android APK (.apk) for $tag"
          }
